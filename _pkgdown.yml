url: https://borenstein-lab.github.io/MAAMOUL/

template:
  bootstrap: 5
  includes:
    in_header: |
      <style>
        html { font-size: 0.8rem; }
        pre, code { font-size: 0.8rem; }

        .container,
        .container-fluid {
          max-width: 90%;
        }

        main {
          padding-left: 0.5rem;
          padding-right: 0.5rem;
        }
        
        .bd-content {
          flex: 0 0 78% !important;
          max-width: 78% !important;
        }
      
        .bd-toc {
          flex: 0 0 18% !important;
          max-width: 18% !important;
        }
        
        .row {
          --bs-gutter-x: 1rem;
        }
      </style>

home:
  sidebar:
    structure: [toc, links]
